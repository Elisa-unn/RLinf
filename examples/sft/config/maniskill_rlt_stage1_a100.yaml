# RLT Stage 1 on 2x A100-80GB: jointly train the ManiSkill OpenPI policy and the
# RLT feature model. Derived from maniskill_rlt_stage1_sft_openpi_pi05.yaml.
#
# Task: PegInsertionSideWideClearance-v1, joint control, two-view RGB, 8D
# pd_joint_delta_pos actions, 10-step chunks, prompt "insert the peg in the hole".
#
# NOTE the env id is registered by RLinf, not by mani_skill: a bare
# `import mani_skill.envs` lists only PegInsertionSide-v1. It appears after
# rlinf.envs.maniskill.peg_insertion_side_variants
#   .register_rlinf_peg_insertion_side_variants()
# runs. Verified on this box with mani_skill 3.0.0b22.
#
# CHANGES FROM UPSTREAM, all forced by this environment:
#
#  1. logger_backends tensorboard, not wandb -- no wandb credentials here, and a
#     missing backend fails the run rather than degrading.
#  2. dataset_path / model_path / norm_stats_path made concrete.
#  3. norm_stats_path set EXPLICITLY rather than left null. The docs warn that
#     Stage 1, Stage 2 rollout.rlt_feature_model and the OpenPI assets must all
#     load the same norm_stats.json, or the scale of the VLA reference actions
#     shifts. Computed with:
#       export HF_LEROBOT_HOME=/workspace/datasets/lerobot
#       PYTHONPATH=/workspace/RLinf python toolkits/lerobot/calculate_norm_stats.py \
#           --config-name pi05_rlt_maniskill_joint \
#           --repo-id maniskill_peginsertionside_joint
#     PYTHONPATH is required: the script is run by path, so sys.path[0] is the
#     script's own directory and `import rlinf` fails without it.
#  4. save_interval 250 -> 500 plus a janitor. train_expert_only is False, so
#     these are the ~32 GiB full-unfreeze checkpoints, not the ~19 GiB frozen
#     kind; 2000/250 = 8 of them is 256 GiB. Run
#     tools/recap_ops/janitor5.sh a100b_rlt_stage1 2
#
# UNCHANGED BUT WORTH KNOWING: total_training_steps is 10000 while max_steps is
# 2000, so the cosine is built over a span 5x longer than the run and the LR
# never anneals -- at step 2000 the factor is still ~0.94 of peak. That is the
# mirror image of the RECAP trap (RECAP_NOTES.md section 3.9, where
# total_training_steps == max_steps drove the LR to 3.2e-12 by the last step).
# Left alone here: no-annealing is defensible for an SFT stage whose output is
# only an initialisation for Stage 2.
#
# RISK TO CHECK ON FIRST LAUNCH: /workspace/models/pi05_base_pytorch was
# converted with --config_name pi05_libero, while this config uses
# pi05_rlt_maniskill_joint. The weights should be config-independent and the
# dataconfig should only govern transforms and dims, but that is NOT verified.
# If the state dict fails to load, re-run the converter with the matching
# config_name.

defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "a100b_rlt_stage1"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 2000
  val_check_interval: -1
  save_interval: 500

data:
  train_data_paths:
    - dataset_path: "/workspace/datasets/lerobot/maniskill_peginsertionside_joint"
      weight: 1.0

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 256
  seed: 0

  model:
    precision: fp32
    model_path: "/workspace/models/pi05_base_pytorch"
    model_type: "openpi_rlinf"
    num_action_chunks: 10
    action_dim: 8
    add_value_head: False
    num_steps: 5
    openpi:
      task: sft
      config_name: "pi05_rlt_maniskill_joint"
      num_images_in_input: 2
      train_expert_only: False
      detach_critic_input: True
      action_horizon: 10
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True
      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_encoder_type: "append_self_attention"
      rlt_image_only: False
      rlt_use_mask: True

    openpi_data:
      repo_id: "maniskill_peginsertionside_joint"
      default_prompt: "insert the peg in the hole"
      # Explicit, not null: Stage 1, Stage 2 rollout.rlt_feature_model and the
      # OpenPI assets must all load the SAME norm_stats.json (see the header).
      norm_stats_path: /workspace/datasets/lerobot/maniskill_peginsertionside_joint/norm_stats.json

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 10000
    lr_warmup_steps: 500
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
