# =============================================================================
# Franka-Sim SAC — env-parallelism throughput sweep, total_num_envs = 2
#
# Tests a claim recorded in frankasim_sac_cnn_async_fix.yaml: "total_num_envs: 1
# matches upstream. Raising it does not help much: with EGL the sim is ~5 ms/step
# and the bottleneck is the per-step round trip to the rollout worker."
#
# One collection cycle is max_steps_per_rollout_epoch (256) steps across
# total_num_envs environments, so transitions per cycle scale with N while
# micro_batch_size / global_batch_size stay at 256 — the gradient step costs the
# same at every N, which isolates the environment side.
#
# Placement is unchanged from the known-good config (env: 0 / actor: 0 /
# rollout: 1). Collocating actor and rollout on one device would transfer weights
# over CUDA IPC and crash with pidfd_getfd in this container; see §1.4 of
# RECAP_NOTES.md. Do not "simplify" this to env,rollout: 0-1.
#
# Differences from frankasim_sac_cnn_async_fix.yaml:
#   total_num_envs: 1 -> 2
#   save_interval / val_check_interval -> -1   (remove save and eval from the
#                                               wall-clock being measured)
#   max_epochs raised so the run never self-terminates; each point is killed on
#   a wall-clock timeout instead.
#
# LAUNCH (run_async.sh exports MUJOCO_GL=egl — do not bypass it):
#   bash examples/embodiment/run_async.sh frankasim_sac_envbench_2env
# =============================================================================

defaults:
  - env/frankasim_pickcube_vision@env.train
  - env/frankasim_pickcube_vision@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  # [HOST] Upstream uses `env,actor,rollout: 0` (all collocated on GPU 0).
  # That cannot work here: when actor and rollout share a device the weight
  # syncer transfers via CUDA IPC, which needs pidfd_getfd ->
  #     RuntimeError: pidfd_getfd: Operation not permitted
  # This container has ptrace_scope=1 and no CAP_SYS_PTRACE, and there is no
  # config switch for the IPC path (see rlinf/scheduler/collective/
  # collective_group.py:_check_same_device_with_peer). Splitting actor and
  # rollout across devices routes the sync through NCCL instead.
  # The rollout worker needs only ~640 MiB, so GPU 1 can be shared.
  component_placement:
    env: 0
    actor: 0
    rollout: 1

runner:
  task_type: embodied
  logger:
    log_path: "../results"   # run_async.sh overrides this to logs/<timestamp>-<config>
    project_name: rlinf
    experiment_name: "sac_envbench_2env"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000000
  max_steps: -1

  only_eval: False
  val_check_interval: -1

  # Safe to use now that algorithm.replay_buffer.save_with_checkpoint is False
  # (see below): each save is ~213 MB of weights + optimizer state.
  #
  # Two constraints:
  #   - check_progress() asserts save_interval % val_check_interval == 0
  #   - with save_with_checkpoint: True this MUST stay -1, because every save
  #     would write the whole replay buffer (~196 KB/sample: 24 GB at step
  #     8189, ~45 GB by step 15000) and fill the disk within minutes. That is
  #     how the pre-fix run died: "/tmp/ray ... is over 95% full" followed by
  #     "RuntimeError: unexpected pos".
  #
  # Note -1 means NOTHING is ever saved, not even at max_steps, because
  # check_progress() gates the train-end save behind `save_interval > 0`.
  save_interval: -1

  weight_sync_interval: 30

algorithm:
  update_epoch: 4
  group_size: 1
  agg_q: min # or mean
  actor_agg_q: mean
  backup_entropy: False
  critic_subsample_size: 2
  target_entropy: -2
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"
  bootstrap_type: standard
  gamma: 0.96  # Discount factor for future rewards
  tau: 0.005 # Soft update coefficient for target networks

  entropy_tuning:
    alpha_type: softplus # choose from ["softplus", "exp", "fixed_alpha"], set to "softplus" or "exp" to enable automatic entropy tuning
    initial_alpha: 0.01  # Initial temperature value
    optim:
      lr: 3.0e-4  # Learning rate for temperature parameter
      lr_scheduler: torch_constant
      clip_grad: 10.0

  critic_actor_ratio: 4
  # Replay buffer settings.
  # cache_size also bounds what save_checkpoint() writes to disk.
  replay_buffer:
  # [EXPERIMENT] Upstream/known-good uses cache_size: 20000. The flat trajectory
  # cache is allocated in ONE shot as cache_size x traj_slot_len x bytes_per_sample
  # (buffer.py:_ensure_capacity -> _alloc_buffer_like). A frankasim vision sample is
  # 256*256*3 = 196,608 B, so 20000 slots is 393 GB at a 100-step slot and
  # **1.007 TB** at a 256-step one:
  #     RuntimeError: DefaultCPUAllocator: can't allocate memory:
  #     you tried to allocate 1006632960000 bytes
  # That is latent, not theoretical. It does not fire at total_num_envs: 1 only
  # because CPU torch.empty is a virtual reservation and this host runs
  # overcommit_memory=0: a 393 GB request passes the heuristic and pages in lazily,
  # a 1.007 TB one is refused. Verified directly — torch.empty(393 GiB) succeeds
  # here, torch.empty(1007 GiB) fails with the identical message.
  # 500 slots x 256 steps x 192 KiB = 24 GB, and is the SAME at every N so the
  # sweep points stay comparable.
    enable_cache: True
    cache_size: 500
    sample_window_size: 500
    min_buffer_size: 5  # Minimum buffer size before training starts
    auto_save: False
    # [FIX] Write weights-only checkpoints (~213 MB instead of 24-45 GB).
    # Upstream save_checkpoint() always bundles the replay buffer; this flag
    # (default True, so other SAC configs are unaffected) skips it on both the
    # save and load paths, which is what makes save_interval usable at all.
    # Set back to True only if you need to resume off-policy training with the
    # original experience, and check `df -h` first.
    save_with_checkpoint: False

  target_update_freq: 1  # Frequency of target network updates
  target_update_type: all # all # select from ["all", "q_head_only"]

env:
  group_name: "EnvGroup"
  # Swept by this experiment; see the header.
  train:
    obs_format: tensor
    total_num_envs: 2
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

  eval:
    rollout_epoch: 5
    obs_format: tensor
    total_num_envs: 1
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False
  model:
    model_path: "/workspace/RLinf-ResNet10-pretrained"  # https://huggingface.co/RLinf/RLinf-ResNet10-pretrained
    state_dim: 7
    action_dim: 4
    num_q_heads: 10
    precision: ${actor.model.precision}
    image_num: 2

  # [HOST] Upstream sets both to True. Disabled for RTX 5090 (sm_120);
  # re-enable and re-measure if the toolchain supports it — step time is
  # 0.95 s/step without them, so the gain would be modest.
  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 256     # how many samples each GPU processes per sampling step
  global_batch_size: 256   # after how many sampled examples we perform one loss backward pass. Requirement: global bz must be '_world_size' multiples of local bs.
  seed: 42
  enable_offload: False
  enable_drq: True
  compile_model: False      # [HOST] see enable_torch_compile above
  model:
    model_path: "/workspace/RLinf-ResNet10-pretrained"  # https://huggingface.co/RLinf/RLinf-ResNet10-pretrained
    state_dim: 7
    action_dim: 4
    num_q_heads: 10
    image_num: 2

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
