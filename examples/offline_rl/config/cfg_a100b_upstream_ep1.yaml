# RECAP Step 4 on 2x A100 80GB, UPSTREAM recipe, one epoch. THE experiment.
#
# ep1 ran this data for these 3066 steps with train_expert_only: True and scored
# 10% on LIBERO-10 Task 0; a second epoch reached 16%; published is 66.5%. Video
# showed the policy reaching for the basket rather than the named object, so the
# frozen vision backbone became the leading suspect. This run changes exactly one
# thing: the VLM trains. Data, steps, lr 1e-5, warmup 300,
# total_training_steps 3066 and global_batch_size 512 are all held at the ep1
# values, which are also the upstream values.
#
# MEASURED here before launching, 5 steps plus a real save:
#   peak 73551 / 81920 MiB   ~30 s/step   checkpoint 31.8 GiB, saves cleanly
# 3066 steps is therefore ~25 h.
#
# save_interval is 500, not 1000. The previous box died at step 530 with its
# first save still 470 steps away and lost five hours. 262 GiB free, a janitor
# keeps the newest 3, so peak use is 4 x 31.8 = 127 GiB.
#
# RESULT (50 episodes, LIBERO-10 Task 0, finished 2026-10-11 20:49 UTC):
#
#   policy                            g=1.0   g=1.5    n
#   untrained pi05_base control        0.00             50
#   frozen VLM, 1 epoch                0.10    0.10     50
#   frozen VLM, 2 epochs               0.16    0.14     50
#   THIS RUN, unfrozen, 1 epoch        0.512   0.36     250 / 50
#   published                          0.665            not stated
#
# 5/50 -> 128/250 by changing one boolean, Fisher two-sided p = 1.75e-08. The
# frozen PaliGemma was the binding constraint; the extra epoch of the ep2 run was
# the wrong axis (0.10 vs 0.16 is Fisher p = 0.55).
#
# THE HEADLINE IS 0.512, NOT 0.56. The first n=50 run gave 0.56 and that turned
# out to be the MAXIMUM of five repeats: 0.56 0.48 0.56 0.48 0.48, pooled
# 128/250 = 0.512, cluster-aware 95% CI [0.458, 0.566]. Per-run spread is 8
# points, so a single n=50 eval is not quotable. Repeat five times first.
#
# The gap to 0.665 IS real at n=250 (p = 6e-07) though it was NOT established at
# n=50 (p = 0.13). See RECAP_NOTES.md sections 3.9 and 3.11.
#
# Intermediate checkpoints at g=1.0 (single runs, so +/- 8 points): step
# 2000 -> 0.36, 2500 -> 0.58, 3066 -> 0.56. 2500 vs 3066 is noise. Do NOT read
# this as a plateau: lr_scheduler is cosine with total_training_steps == 3066 and
# min_lr 0, so the learning rate was 3.2e-12 by the last step and the model was
# effectively frozen. cfg_a100b_constlr.yaml removes that confound.
#
# Training loss does not predict any of this: 0.0129 converged here vs 0.016
# frozen, a 19% improvement for a 5x success rate. Select on rollout eval only.
#
# NOTE this run has no behaviour-cloning baseline. See cfg_a100b_bc_allpos.yaml:
# without it, 0.512 is equally well explained by "train a VLA on 1.56M frames of
# Task-0 data and it gets good at Task 0".

defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "a100b_upstream_ep1"
    logger_backends: ["tensorboard"]

  max_epochs: 30000
  # 1 epoch = 1,569,879 samples / 512 = 3066 steps ~= 19 h at 22.8 samples/s
  # (actual: 19h00m). Upstream runs 30000 steps (~10 epochs); runner.resume_dir
  # can extend this later.
  max_steps: 3066
  val_check_interval: -1

  # Each checkpoint here is 31.8 GiB (measured): full_weights.pt 8.5G plus two
  # DCP shards of 13.0G + 12.5G holding model + optimizer state. Unfreezing the
  # VLM is what makes it 31.8 rather than the 19 GiB of the frozen runs, since
  # the optimizer now carries state for all 3.62B parameters. Plan disk BEFORE
  # starting and run a janitor: 262 GiB free, keep the newest 3, peak 127 GiB.
  save_interval: 500

data:
  num_workers: 8
  # Must match advantage.tag from Step 3.
  advantage_tag: "fail300_N10_ckpt3000_q30"
  balance_dataset_weights: true
  seed: 42

  train_data_paths:
    # With balance_dataset_weights the resulting sampling weights are
    # [0.0051, 0.9949] — the 8005-frame sft split is a sparse regulariser, and
    # 99.5% of the training signal comes from Task-0 rollouts.
    - dataset_path: /workspace/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_sft
      type: "sft"
      weight: 1.0
    - dataset_path: /workspace/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_train
      type: "rollout"
      weight: 1.0

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 512      # 2 GPUs x 32 x 8 gradient-accumulation steps
  seed: 0

  model:
    precision: null
    # Converted from the JAX release. See RECAP_NOTES.md: the converter must be
    # invoked with `python -m`, and LIBERO norm stats must be downloaded
    # separately into <model_path>/physical-intelligence/libero/.
    model_path: /workspace/models/pi05_base_pytorch
    model_type: "cfg_model"
    add_value_head: False
    openpi:
      config_name: "pi05_libero"
      cfgrl_guidance_scale: 1.0
      unconditional_prob: 0.1
      train_expert_only: False  # upstream: the whole VLM trains
      guidance_type: "positive"
      positive_only_conditional: true

  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: "cosine"
    # Scaled to this 3066-step run. Leaving the upstream 5000/30000 would keep
    # the LR in warmup for the entire epoch.
    lr_warmup_steps: 300
    total_training_steps: 3066
    min_lr: 0.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
