# RECAP Step 4, unfrozen VLM, CONSTANT learning rate. 3066 steps.
#
# PURPOSE: remove one confound, nothing else. The cosine run
# (cfg_a100b_upstream_ep1.yaml) scored 2000 -> 0.36, 2500 -> 0.58, 3066 -> 0.56
# and looked like it had plateaued. But that schedule was
# `cosine` with `total_training_steps: 3066` and `min_lr: 0.0`, so by step 3066
# the learning rate was ZERO and it was already low at 2500. The apparent
# plateau is therefore indistinguishable from "the learning rate decayed away".
#
# `lr_scheduler: "constant"` is warmup-then-flat (see get_lr_scheduler in
# rlinf/hybrid_engines/fsdp/utils.py) and ignores total_training_steps, so the
# confound is gone. Everything else is held at the cosine run's values.
#
#   still rising at 3066  -> the plateau was the schedule; more steps is the
#                            live hypothesis for the remaining gap to 0.665
#   plateaus again        -> one epoch of this data really is saturated, and the
#                            remaining gap points at the value model (3000 steps
#                            here vs ckpt18000 upstream)
#
# Note upstream's own value-model config uses lr_scheduler: "constant" for the
# same reason, so this is not an exotic choice.
#
# ~25 h at ~30 s/step. Peak 73551 / 81920 MiB measured on the cosine run with
# identical shapes. save_interval 500 with a janitor keeping the newest 3.

defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "a100b_constlr"
    logger_backends: ["tensorboard"]

  max_epochs: 30000
  # 1 epoch = 1,569,879 samples / 512 = 3066 steps ~= 19 h at 22.8 samples/s
  # (actual: 19h00m). Upstream runs 30000 steps (~10 epochs); runner.resume_dir
  # can extend this later.
  max_steps: 3066
  val_check_interval: -1

  # Each checkpoint here is 31.8 GiB (measured): full_weights.pt 8.5G plus two
  # DCP shards of 13.0G + 12.5G holding model + optimizer state. Unfreezing the
  # VLM is what makes it 31.8 rather than the 19 GiB of the frozen runs, since
  # the optimizer now carries state for all 3.62B parameters. Plan disk BEFORE
  # starting and run a janitor: 262 GiB free, keep the newest 3, peak 127 GiB.
  save_interval: 500

data:
  num_workers: 8
  # Must match advantage.tag from Step 3.
  advantage_tag: "fail300_N10_ckpt3000_q30"
  balance_dataset_weights: true
  seed: 42

  train_data_paths:
    # With balance_dataset_weights the resulting sampling weights are
    # [0.0051, 0.9949] — the 8005-frame sft split is a sparse regulariser, and
    # 99.5% of the training signal comes from Task-0 rollouts.
    - dataset_path: /workspace/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_sft
      type: "sft"
      weight: 1.0
    - dataset_path: /workspace/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_train
      type: "rollout"
      weight: 1.0

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 512      # 2 GPUs x 32 x 8 gradient-accumulation steps
  seed: 0

  model:
    precision: null
    # Converted from the JAX release. See RECAP_NOTES.md: the converter must be
    # invoked with `python -m`, and LIBERO norm stats must be downloaded
    # separately into <model_path>/physical-intelligence/libero/.
    model_path: /workspace/models/pi05_base_pytorch
    model_type: "cfg_model"
    add_value_head: False
    openpi:
      config_name: "pi05_libero"
      cfgrl_guidance_scale: 1.0
      unconditional_prob: 0.1
      train_expert_only: False  # upstream: the whole VLM trains
      guidance_type: "positive"
      positive_only_conditional: true

  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    # THE ONE CHANGE from cfg_a100b_upstream_ep1.yaml.
    lr_scheduler: "constant"
    lr_warmup_steps: 300        # same warmup as the cosine run
    total_training_steps: 3066  # ignored by "constant"; kept so the A/B diff is one line
    min_lr: 0.0                 # ignored by "constant"

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
