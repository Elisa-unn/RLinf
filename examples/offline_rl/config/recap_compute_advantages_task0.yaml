# RECAP Step 3 — advantage labeling for LIBERO-10 Task 0.
# Task-0 variant of recap_compute_advantages.yaml (upstream template left intact).
#
# Both datasets are labeled in ONE run on purpose: positive_quantile is applied
# to the COMBINED pool. compute_advantages.py concatenates all datasets and then
# takes a single quantile (see the all_advantages / unified_threshold block near
# the end of the file), and writes that global threshold into
# meta/mixture_config.yaml. Labelling the splits separately would give the
# all-success sft split and the failure-heavy rollout split their own
# thresholds, which is wrong.
# Also required by the docs: train_data_paths must stay consistent across
# steps 1/2/3/4. Step 1 and Step 2 both used these same two datasets, and
# Step 4 (cfg_rl_openpi.yaml) consumes both.
#
# The eval split (libero10_task0_eval) is deliberately NOT here: it exists only
# to monitor value-model overfitting in Step 2.
#
# Verified run (2026-09-22, 2x RTX 5090, 5h21m, 0 errors):
#   Number of datasets: 2        Samples per dataset: [8005, 1561874]
#   Unified threshold (70th pct): 0.0110
#   Total positive: 470964 / 1569879 = 30.0%   (exactly matches q=0.3)
#   Per-dataset positive rate: sft 30.9%, rollout 30.0%
#   NOTE the saved boolean for the sft split is all-True regardless — that is
#   intentional upstream behaviour (compute_advantages.py forces
#   save_df["advantage"] = True when dataset_type == "sft"); the 30.9% is only
#   the reported pre-override rate.
#
# Sanity checks that passed on the output parquet:
#   value_current  sft -0.232 +/- 0.129   rollout -0.517 +/- 0.230
#     -> the value model clearly separates expert demos from mixed rollouts,
#        and both stay inside [-1, 0]. This is the real check that Step 2
#        worked; the near-identical positive RATES are not, because advantage
#        is a TD quantity centred on zero by construction.
#   reward_sum_raw sft mean -9.79, min -10  (N=10 lookahead, r=-1/step)
#          rollout mean -13.88, min -309   (failures carry the -300 penalty)
#
# Usage (both GPUs free):
#   ulimit -n 65535                      # container default of 1024 is far too
#                                        # low for 2 ranks x 28 dataloader
#                                        # workers -> "Too many open files"
#   source .venv_recap/bin/activate
#   bash examples/offline_rl/advantage_labeling/recap/process/run_compute_advantages.sh \
#       recap_compute_advantages_task0 --nproc 2

defaults:
  - model/recap_value_model@advantage.model

advantage:
  # Value model from Step 2. get_model() resolves
  # <dir>/model_state_dict/full_weights.pt underneath this path.
  # NOTE: the upstream example tag says ckpt18000; the verified run used
  # ckpt3000 (eval cat_acc_best was still climbing when it was stopped). If the
  # Step 4 result falls short of the 66.5% reference, insufficient value-model
  # training is the first thing to re-check — the SFT supports runner.resume_dir.
  value_checkpoint: /path/to/logs/value_sft/<run>/<experiment>/checkpoints/global_step_<N>/actor

  # [HOST] Upstream default is 1024, which OOMs on a 31.4 GiB card (it tried to
  # allocate 3.78 GiB with 3.53 GiB free). 128 peaks at ~7.8 GiB.
  batch_size: 128
  flush_interval: 256
  # [HOST] Upstream default is 12. This job is CPU-bound on video decode plus
  # image/tokenizer prep (cpu_prep_in_workers=True), with the GPU at 0%.
  # Measured: 12/gpu -> 23.9 samples/s (ETA 8.6h); 28/gpu -> ~41 samples/s
  # sustained (actual 5h21m). Container quota was 61.44 CPUs, so 2 x 28 = 56
  # leaves a little headroom; going higher starves the main processes.
  num_dataloader_workers_per_gpu: 28
  prefetch_factor: 2
  discount_next_value: true
  positive_quantile: 0.3
  # Writes meta/advantages_{tag}.parquet; Step 4 reads it via data.advantage_tag.
  tag: "fail300_N10_ckpt3000_q30"
  # Reads meta/returns_{tag}.parquet written by Step 1 (matches data.tag there
  # and in recap_value_model_sft.yaml).
  returns_tag: "fail300"

  model:
    critic_expert_variant: "gemma_1m"
    tokenizer_path: /path/to/models/gemma-3-270m
    siglip_path: /path/to/models/siglip2-so400m-patch14-224
    gemma3_path: /path/to/models/gemma-3-270m

data:
  # Must match data.model_type in recap_value_model_sft.yaml — it selects the
  # input transforms and quantile normalization used to score frames.
  model_type: "pi05"

  train_data_paths:
    # NOTE despite the directory name, this split is NOT Task-0 expert data:
    # it holds 30 episodes / 8005 frames spanning all 10 LIBERO-10 tasks
    # (3 demos each), of which only 836 frames are Task 0. It acts as a sparse
    # anti-forgetting regulariser — with balance_dataset_weights it ends up at
    # ~0.5% of the sampling weight in Step 4.
    - dataset_path: /path/to/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_sft
      robot_type: "libero"
      type: "sft"          # expert demos; forces all-True advantage labels
      weight: 1.0
    # 4096 episodes / 1.56M frames, all on Task 0
    # ("put both the alphabet soup and the tomato sauce in the basket").
    - dataset_path: /path/to/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_train
      robot_type: "libero"
      type: "rollout"      # few-shot pi0.5 rollouts, successes + failures
      weight: 1.0

  advantage_lookahead_step: 10
  gamma: 1.0

distributed:
  enabled: true
  backend: "nccl"
  timeout: 3600

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
  job:
    chdir: false
