# RECAP Step 4 evaluation — LIBERO-10 Task 0, CFG-trained pi0.5.
#
# Reference (RLinf docs): 48.8% few-shot SFT baseline -> 66.5% after one RECAP
# iteration. Task 0 is "put both the alphabet soup and the tomato sauce in the
# basket", 50 init states — the single task the rollout split was collected on.
#
# Verified results (2026-09-25, 50 episodes each, ~6.5 min per run):
#   untrained pi05_base control (ckpt_path=null) : 0.00
#   cfg_sft_2gpu_ep1 @ cfgrl_guidance_scale 1.0  : 0.10
#                                            1.5 : 0.10
#                                            2.0 : 0.04
#                                            3.0 : 0.00
# Guidance above ~1.5 degrades, which is the expected CFG behaviour when the
# conditional signal is still weak. Note scale=1.0 is NOT "no guidance": the
# model computes (1 - s)*v_uncond + s*v_cond, so 1.0 is the pure conditional
# prediction and only s > 1 extrapolates.
#
# Derived from evaluations/libero/libero_10_openpi_pi05_eval.yaml. Changes:
#   - task_id_filter: [0] + total_num_envs: 50
#       Upstream evaluates all of LIBERO-10 (500 envs = 10 tasks x 50 trials).
#       The RECAP run only trained on Task 0, and Task 0 has exactly 50 init
#       states (verified against the benchmark), so 50 envs = one full pass.
#   - model_type: cfg_model (not openpi)
#       The trained policy is the CFG wrapper; cfg_model maps to
#       _build_openpi_cfg, which applies guidance at inference.
#   - placement: rollout and env on SEPARATE GPUs, one rank each.
#       Upstream `env,rollout: all` DEADLOCKS on a 2-GPU box: the driver blocks
#       in futex_wait, both env parents sit idle in ep_poll, and all 60 env
#       subprocesses wait in unix_stream_data_wait. 15 minutes, zero progress,
#       no error. `env,rollout: 0-0` (single rank) works but 50 LIBERO envs plus
#       the model on one card OOMs; splitting across cards fits (rollout ~17 GB
#       on GPU0, 50 envs ~32 GB on GPU1).
#
# LAUNCH — run_eval.sh defaults MUJOCO_GL to osmesa (~93x slower), so override:
#   ulimit -n 65535
#   MUJOCO_GL=egl PYOPENGL_PLATFORM=egl \
#   bash evaluations/run_eval.sh libero libero_10_task0_cfg_eval \
#       rollout.model.openpi.cfgrl_guidance_scale=1.0
#
# Hydra cannot override the placement key from the CLI — `env,rollout` contains
# a comma and the override grammar rejects it (LexerNoViableAltException). Edit
# the file instead.

defaults:
  - env/libero_10@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    rollout: 0
    env: 1

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_10_task0_cfg_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  # Set to null to evaluate the untrained base model as a control.
  # EmbodiedEvalRunner builds only rollout + env (no actor), and with
  # only_eval: True the rollout worker loads this into cfg.rollout.model itself.
  # model_path below must still point at the converted base dir, because the
  # builder reads norm_stats and tokenizer assets from it.
  ckpt_path: /path/to/logs/cfg_rl/<run>/<experiment>/checkpoints/global_step_<N>/actor/model_state_dict/full_weights.pt

env:
  group_name: "EnvGroup"

  eval:
    task_id_filter: [0]        # LIBERO-10 Task 0 only (libero_env.py reads this)
    rollout_epoch: 1
    total_num_envs: 50         # Task 0 has exactly 50 init states
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 520
    max_steps_per_rollout_epoch: 520
    group_size: 1
    is_eval: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: /path/to/models/pi05_base_pytorch
    model_type: "cfg_model"
    num_action_chunks: 10       # matches action_horizon used in training/advantages
    openpi:
      config_name: "pi05_libero"
      noise_level: 0.3
      # Swept on the CLI. Training used 1.0.
      cfgrl_guidance_scale: 1.0
      positive_only_conditional: true
      train_expert_only: True
